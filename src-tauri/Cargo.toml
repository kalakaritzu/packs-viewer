[package]
name = "packs-viewer"
version = "1.1.0"
description = "Fast, clean browser for your FL Studio sample packs"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rayon = "1"
walkdir = "2"
rfd = "0.15"
arboard = "3"
drag = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
